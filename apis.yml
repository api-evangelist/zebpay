aid: zebpay
name: ZebPay
description: ZebPay is an Indian cryptocurrency exchange offering spot trading in INR and USDT pairs and crypto futures. It publishes REST APIs for spot (sapi.zebpay.com, documented on GitHub), a legacy
  spot API (www.zebapi.com) and futures (futuresbe.zebpay.com), public Postman documentation at docs.zebpay.com and apidocs.zebpay.com, WebSocket market streams, futures webhooks, and an MCP server for
  AI-assisted trading.
