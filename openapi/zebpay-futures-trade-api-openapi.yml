        limit (number, required): The maximum number of open orders to retrieve.


        since (string, optional): A timestamp to retrieve open orders since a specific time.


        Response


        The response for this request is a JSON object with the following properties:


        statusDescription (string): Description of the status.


        data (array): An array of open order objects with the following properties:


        clientOrderId (string): The client order ID.


        time (string): The timestamp.


        symbol (string): The symbol for the open order.


        contractType (string): The contract type.


        type (string): The type of order.


        side (string): The side of the order.


        price (number): The price of the order.


        orderAmount (number): The amount of the order.


