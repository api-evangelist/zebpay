  /api/v1/trade/addMargin:
    post:
      tags:
      - Futures > Trade
      summary: Add Margin
      description: 'Add Margin Trade


        This endpoint allows the user to add margin to a specific position.


        Request Body


        symbol (string): The trading symbol for the position.


        positionId (string): The unique identifier of the position.


        amount (number): The amount of margin to be added.


        timestamp (number): The timestamp for the margin addition.


        The request body should be in JSON format with the specified keys and their respective data types.


        Response


        The response is in JSON format and has the following properties:


        statusDescription (string): Description of the status.


        data (object)


        lockedBalance (number): The locked balance after adding margin.


        withdrawableBalance (number): The withdrawable balance after adding margin.


        asset (string): The asset related to the margin trade.


        message (string): Additional message related to the response.


        statusCode (number): Status code of the response.


        customMessage (array of strings): Custom messages related to the response.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                symbol: BTCINR
                positionId: 0607c789-8d99-492a-9392-4d9dbc86f6d3
                amount: 100
                timestamp: 0
