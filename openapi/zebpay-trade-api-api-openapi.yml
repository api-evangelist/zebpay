  /orders/balance:
    get:
      tags:
      - Trade API
      summary: Trade Balance
      description: 'Get Balance for Trade Pair


        This request retrieves the balance information for a specific trade pair for a user.


        Purpose


        The purpose of this request is to provide the user with balance information for a specific trade pair. If the trade_pair is not provided, the request will return balances for all coins.


        Parameters


        trade_pair (optional): The specific trade pair for which balance information is requested. If not provided, the request will return balances for all coins.'
      parameters:
      - name: X-AUTH-APIKEY
        in: header
        schema:
          type: string
        example: '{{APIKEY}}'
      - name: X-AUTH-SIGNATURE
        in: header
        schema:
          type: string
        example: '{{ApiSignature}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getOrdersBalance
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
    - url: https://www.zebapi.com
    - url: https://futuresbe.zebpay.com
