paths:
  /orders:
    post:
      tags:
      - Trade API
      summary: Place a New Market Sell Order
      description: User can place a market order, which will be executed immediately at the current market price. The amount of quote currency for the given pair will be kept on hold for the duration of the order.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                trade_pair: BTC-INR
                side: ask
                size: 1.0e-05
                tradeType: 2
                platform: API_Trading
                timestamp: 0
      parameters:
      - name: X-AUTH-APIKEY
        in: header
        schema:
          type: string
        example: '{{APIKEY}}'
      - name: X-AUTH-SIGNATURE
        in: header
        schema:
          type: string
        example: '{{ApiSignature}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: OK
          headers:
            Date:
              schema:
                type: string
                example: Tue, 12 Nov 2024 13:31:28 GMT
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
            Connection:
              schema:
                type: string
                example: keep-alive
            access-control-expose-headers:
              schema:
                type: string
                example: Order-Total-Count
            CF-Cache-Status:
              schema:
                type: string
                example: DYNAMIC
            X-Frame-Options:
              schema:
                type: string
                example: SAMEORIGIN
            Server:
              schema:
                type: string
                example: cloudflare
            CF-RAY:
              schema:
                type: string
                example: 8e16e1f0d9e0401f-BOM
            Content-Encoding:
              schema:
                type: string
                example: gzip
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  id: 1395508961
                  price: 0
                  side: ask
                  size: 1.0e-05
                  status: pending
                  trade_pair: BTC-INR
                  type: Market
                  created_at: 1753340818725
                statusCode: 200
                statusDescription: Success
      operationId: postOrders
      x-operation-id-source: derived
    get:
      tags:
      - Trade API
      summary: List Trade Complete Orders
      description: Users can list their current orders and can also view open as well as settled orders. User needs to pass ORDER STATUS "Pending" to get all unsettled orders, "all" to get all orders.
      security:
      - noauthAuth: []
      parameters:
      - name: X-AUTH-APIKEY
        in: header
        schema:
          type: string
        example: '{{APIKEY}}'
      - name: X-AUTH-SIGNATURE
        in: header
        schema:
          type: string
        example: '{{ApiSignature}}'
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: OK
          headers:
            Date:
              schema:
                type: string
                example: Wed, 16 Oct 2024 15:46:11 GMT
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
            Connection:
              schema:
                type: string
                example: keep-alive
            access-control-expose-headers:
              schema:
                type: string
                example: Order-Total-Count
            CF-Cache-Status:
              schema:
                type: string
                example: DYNAMIC
            Server:
              schema:
                type: string
                example: cloudflare
            CF-RAY:
              schema:
                type: string
                example: 8d392e25f983414e-BOM
            Content-Encoding:
              schema:
                type: string
                example: gzip
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                - id: 616239111
                  price: 4400000
                  size: 0.00020455
                  type: limit
                  trade_pair: BTC-INR
                  side: Bid
                  created_at: 1729093567540
                  executed_value: 900.02
                  open_size: 0.00020455
                  filled_size: 0
                  status: pending
                  market_order_amt: 0
                  stop_price: 0
                statusCode: 200
                statusDescription: Success
      operationId: getOrders
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
    - url: https://www.zebapi.com
    - url: https://futuresbe.zebpay.com
