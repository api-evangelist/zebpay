openapi: 3.2.0
info:
  title: Zebpay Market API
  version: 1.0.0
  x-refined-note:
  - x-generated differs across the merged source definitions and was not carried
  - x-method differs across the merged source definitions and was not carried
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Market across 2 of this provider''s published API definitions: zebpay-postman-converted.yml, zebpay-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://{{baseurl}}
- url: https://www.zebapi.com
- url: https://futuresbe.zebpay.com
- url: https://www.zebapi.com/api/v1
  description: Spot (legacy), collection baseurl variable
tags:
- name: Market
  description: These APIs returns market details including ticker(s), book (pending orders), trades (executed orders) etc.
paths:
  /market:
    get:
      tags:
      - Market
      summary: Market
      description: 'Users can get a list of 24 hr stats for available pair by this API. Volume is in base currency units.


        Note: Pass query string parameter ?group=singapore'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: OK
          headers:
            Date:
              schema:
                type: string
                example: Wed, 16 Oct 2024 13:07:36 GMT
            Content-Type:
              schema:
                type: string
                example: application/json
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
            Connection:
              schema:
                type: string
                example: keep-alive
            CF-Cache-Status:
              schema:
                type: string
                example: DYNAMIC
            Server:
              schema:
                type: string
                example: cloudflare
            CF-RAY:
              schema:
                type: string
                example: 8d3845da0f113ae5-BOM
            Content-Encoding:
              schema:
                type: string
                example: gzip
          content:
            application/json:
              schema:
                type: object
